<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave Management - HRGenius</title>

    <link rel="stylesheet" href="CSS/style.css">

    <style>

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: var(--sidebar);

            color: var(--text);

            padding: 15px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        nav h2 {
            color: var(--primary);
        }

        nav div {
            display: flex;

            align-items: center;

            gap: 10px;
        }

        nav button {
            padding: 8px 14px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-weight: 600;
        }

        .dashboard-btn {
            background: var(--primary);

            color: white;
        }

        .dashboard-btn:hover {
            background: var(--primary-hover);
        }

        .logout-btn {
            background: var(--danger);

            color: white;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 90%;

            margin: 30px auto;
        }

        h1 {
            margin-bottom: 25px;

            color: var(--text);
        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .card {
            background: var(--card);

            color: var(--text);

            padding: 20px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        .card h3 {
            margin-bottom: 10px;

            color: var(--muted);
        }

        .card p {
            font-size: 28px;

            font-weight: bold;

            color: var(--primary);
        }


        /* =========================
           FORM
        ========================= */

        .form-container {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            margin-bottom: 30px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        .form-container h2 {
            margin-bottom: 20px;

            color: var(--text);
        }

        form {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 11px;

            border: 1px solid var(--border);

            border-radius: 5px;

            font-size: 14px;

            background: var(--input);

            color: var(--text);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--muted);
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;

            border-color: var(--primary);
        }

        textarea {
            resize: vertical;

            min-height: 90px;
        }

        .full {
            grid-column: span 2;
        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {
            background: var(--primary);

            color: white;

            border: none;

            padding: 12px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;

            font-weight: 600;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 15px;

            font-weight: bold;
        }


        /* =========================
           TABLE
        ========================= */

        .table-container {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            overflow-x: auto;
        }

        .table-container h2 {
            color: var(--text);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;

            background: var(--card);
        }

        th,
        td {
            padding: 12px;

            border-bottom: 1px solid var(--border);

            text-align: left;

            white-space: nowrap;
        }

        th {
            background: var(--hover);

            color: var(--text);
        }

        td {
            color: var(--text);
        }

        tbody tr:hover {
            background: var(--hover);
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 5px 10px;

            border-radius: 15px;

            font-size: 12px;

            font-weight: bold;

            display: inline-block;
        }

        .pending {
            background: rgba(217, 119, 6, 0.12);

            color: var(--warning);
        }

        .approved {
            background: rgba(22, 163, 74, 0.12);

            color: var(--success);
        }

        .rejected {
            background: rgba(220, 38, 38, 0.12);

            color: var(--danger);
        }


        /* =========================
           ACTION BUTTONS
        ========================= */

        .action-btn {
            padding: 6px 10px;

            border: none;

            border-radius: 4px;

            cursor: pointer;

            margin-right: 5px;

            font-weight: 600;
        }

        .approve-btn {
            background: #22c55e;

            color: white;
        }

        .approve-btn:hover {
            background: #16a34a;
        }

        .reject-btn {
            background: #ef4444;

            color: white;
        }

        .reject-btn:hover {
            background: #dc2626;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

        }


        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;

                gap: 10px;
            }

            nav div {
                flex-wrap: wrap;

                justify-content: center;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <h2>
            HRGenius
        </h2>


        <div>

            <button
                class="dashboard-btn"
                onclick="goDashboard()">

                Dashboard

            </button>


            <button
                id="themeToggle"
                class="theme-toggle"
                onclick="toggleTheme()">

                🌙 Dark Mode

            </button>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">


        <h1>
            Leave Management
        </h1>


        <!-- =========================
             SUMMARY CARDS
        ========================= -->

        <div class="cards">


            <div class="card">

                <h3>
                    Total Leaves
                </h3>

                <p id="totalLeaves">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Pending
                </h3>

                <p id="pendingLeaves">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Approved
                </h3>

                <p id="approvedLeaves">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Rejected
                </h3>

                <p id="rejectedLeaves">
                    0
                </p>

            </div>


        </div>


        <!-- =========================
             APPLY LEAVE
        ========================= -->

        <div class="form-container">

            <h2>
                Apply Leave
            </h2>


            <form id="leaveForm">


                <input
                    type="text"
                    id="employeeId"
                    placeholder="Employee ID"
                    required
                >


                <select
                    id="leaveType"
                    required>

                    <option value="">
                        Select Leave Type
                    </option>

                    <option value="Sick">
                        Sick
                    </option>

                    <option value="Casual">
                        Casual
                    </option>

                    <option value="Annual">
                        Annual
                    </option>

                    <option value="Emergency">
                        Emergency
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <input
                    type="date"
                    id="startDate"
                    required
                >


                <input
                    type="date"
                    id="endDate"
                    required
                >


                <textarea
                    id="reason"
                    class="full"
                    placeholder="Reason for leave"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="submit-btn full">

                    Apply Leave

                </button>


            </form>


            <div
                id="message"
                class="message">

            </div>

        </div>


        <!-- =========================
             LEAVE RECORDS
        ========================= -->

        <div class="table-container">

            <h2>
                Leave Requests
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Employee
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Leave Type
                        </th>

                        <th>
                            Start Date
                        </th>

                        <th>
                            End Date
                        </th>

                        <th>
                            Reason
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="leaveTableBody">

                </tbody>

            </table>

        </div>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        const token =
            localStorage.getItem("token");


        // =========================
        // CHECK LOGIN
        // =========================

        if (!token) {

            window.location.href =
                "login.html";

        }


        const API =
            "http://localhost:5000/api/leaves";


        // =========================
        // DASHBOARD
        // =========================

        function goDashboard() {

            window.location.href =
                "dashboard.html";

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "token"
            );

            window.location.href =
                "login.html";

        }


        // =========================
        // APPLY LEAVE
        // =========================

        document
            .getElementById("leaveForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const employeeId =
                        document
                            .getElementById(
                                "employeeId"
                            )
                            .value
                            .trim();


                    const leaveType =
                        document
                            .getElementById(
                                "leaveType"
                            )
                            .value;


                    const startDate =
                        document
                            .getElementById(
                                "startDate"
                            )
                            .value;


                    const endDate =
                        document
                            .getElementById(
                                "endDate"
                            )
                            .value;


                    const reason =
                        document
                            .getElementById(
                                "reason"
                            )
                            .value
                            .trim();


                    const message =
                        document.getElementById(
                            "message"
                        );


                    try {


                        const response =
                            await fetch(

                                `${API}/create`,

                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            `Bearer ${token}`

                                    },

                                    body:
                                        JSON.stringify({

                                            employeeId,

                                            leaveType,

                                            startDate,

                                            endDate,

                                            reason

                                        })

                                }

                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            message.style.color =
                                "var(--danger)";

                            message.textContent =
                                data.message ||
                                "Failed to apply leave";

                            return;

                        }


                        message.style.color =
                            "var(--success)";


                        message.textContent =
                            "Leave applied successfully!";


                        document
                            .getElementById(
                                "leaveForm"
                            )
                            .reset();


                        loadLeaves();


                    }

                    catch (error) {

                        console.log(
                            "Apply Leave Error:",
                            error
                        );


                        message.style.color =
                            "var(--danger)";


                        message.textContent =
                            "Server connection failed";

                    }

                }
            );


        // =========================
        // LOAD LEAVES
        // =========================

        async function loadLeaves() {

            try {


                const response =
                    await fetch(

                        API,

                        {

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }

                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    console.log(data);

                    return;

                }


                const leaves =
                    data.leaves || [];


                // =========================
                // SUMMARY COUNTS
                // =========================

                document.getElementById(
                    "totalLeaves"
                ).textContent =
                    leaves.length;


                document.getElementById(
                    "pendingLeaves"
                ).textContent =
                    leaves.filter(

                        leave =>
                            leave.status === "Pending"

                    ).length;


                document.getElementById(
                    "approvedLeaves"
                ).textContent =
                    leaves.filter(

                        leave =>
                            leave.status === "Approved"

                    ).length;


                document.getElementById(
                    "rejectedLeaves"
                ).textContent =
                    leaves.filter(

                        leave =>
                            leave.status === "Rejected"

                    ).length;


                // =========================
                // TABLE
                // =========================

                const table =
                    document.getElementById(
                        "leaveTableBody"
                    );


                table.innerHTML = "";


                if (leaves.length === 0) {

                    table.innerHTML = `

                        <tr>

                            <td
                                colspan="9"
                                style="
                                    text-align:center;
                                    padding:20px;
                                    color:var(--muted);
                                ">

                                No leave requests found

                            </td>

                        </tr>

                    `;

                    return;

                }


                leaves.forEach(
                    leave => {


                        const employee =
                            leave.employeeId;


                        const employeeName =
                            employee &&
                            typeof employee === "object"
                                ? employee.name
                                : "Unknown";


                        const employeeEmail =
                            employee &&
                            typeof employee === "object"
                                ? employee.email
                                : "-";


                        const department =
                            employee &&
                            typeof employee === "object"
                                ? employee.department
                                : "-";


                        const statusClass =
                            leave.status
                                ? leave.status.toLowerCase()
                                : "pending";


                        const startDate =
                            leave.startDate
                                ? new Date(
                                    leave.startDate
                                  )
                                    .toLocaleDateString()
                                : "-";


                        const endDate =
                            leave.endDate
                                ? new Date(
                                    leave.endDate
                                  )
                                    .toLocaleDateString()
                                : "-";


                        let actions =
                            "-";


                        // =========================
                        // APPROVE / REJECT
                        // =========================

                        if (
                            leave.status === "Pending"
                        ) {

                            actions = `

                                <button
                                    class="action-btn approve-btn"
                                    onclick="updateLeave('${leave._id}', 'Approved')">

                                    Approve

                                </button>


                                <button
                                    class="action-btn reject-btn"
                                    onclick="updateLeave('${leave._id}', 'Rejected')">

                                    Reject

                                </button>

                            `;

                        }


                        // =========================
                        // TABLE ROW
                        // =========================

                        table.innerHTML += `

                            <tr>

                                <td>
                                    ${employeeName}
                                </td>

                                <td>
                                    ${employeeEmail}
                                </td>

                                <td>
                                    ${department}
                                </td>

                                <td>
                                    ${leave.leaveType || "-"}
                                </td>

                                <td>
                                    ${startDate}
                                </td>

                                <td>
                                    ${endDate}
                                </td>

                                <td>
                                    ${leave.reason || "-"}
                                </td>

                                <td>

                                    <span
                                        class="status ${statusClass}">

                                        ${leave.status || "Pending"}

                                    </span>

                                </td>

                                <td>
                                    ${actions}
                                </td>

                            </tr>

                        `;

                    }
                );


            }

            catch (error) {

                console.log(
                    "Error loading leaves:",
                    error
                );

            }

        }


        // =========================
        // UPDATE LEAVE STATUS
        // =========================

        async function updateLeave(
            id,
            status
        ) {


            try {


                let endpoint;


                if (status === "Approved") {

                    endpoint =
                        `${API}/${id}/approve`;

                }

                else {

                    endpoint =
                        `${API}/${id}/reject`;

                }


                const response =
                    await fetch(

                        endpoint,

                        {

                            method: "PUT",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }

                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.message ||
                        "Failed to update leave"
                    );

                    return;

                }


                alert(
                    `Leave ${status.toLowerCase()} successfully`
                );


                loadLeaves();


            }

            catch (error) {

                console.log(
                    "Update Leave Error:",
                    error
                );


                alert(
                    "Server connection failed"
                );

            }

        }


        // =========================
        // INITIAL LOAD
        // =========================

        loadLeaves();

    </script>


    <!-- Authentication -->

    <script src="JS/auth.js"></script>


    <!-- Theme -->

    <script src="JS/theme.js"></script>


</body>

</html>
