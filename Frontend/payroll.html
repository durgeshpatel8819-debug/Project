<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payroll Management - HRGenius</title>

    <link rel="stylesheet" href="CSS/style.css">

    <style>

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: var(--sidebar);
            color: var(--text);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        nav h2 {
            color: var(--primary);
        }

        nav div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        nav button {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .dashboard-btn {
            background: var(--primary);
            color: white;
        }

        .dashboard-btn:hover {
            background: var(--primary-hover);
        }

        .logout-btn {
            background: var(--danger);
            color: white;
        }

        .logout-btn:hover {
            opacity: 0.9;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h1 {
            margin-bottom: 25px;
            color: var(--text);
        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            color: var(--text);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card h3 {
            margin-bottom: 10px;
            color: var(--muted);
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: var(--primary);
        }


        /* =========================
           FORM
        ========================= */

        .form-container {
            background: var(--card);
            color: var(--text);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .form-container h2 {
            margin-bottom: 20px;
            color: var(--text);
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group label {
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 14px;
            background: var(--input);
            color: var(--text);
            box-sizing: border-box;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        input[type="month"] {
            cursor: pointer;
        }

        .full {
            grid-column: span 2;
        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }


        /* =========================
           TABLE
        ========================= */

        .table-container {
            background: var(--card);
            color: var(--text);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .table-container h2 {
            color: var(--text);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: var(--card);
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
            white-space: nowrap;
        }

        th {
            background: var(--hover);
            color: var(--text);
        }

        td {
            color: var(--text);
        }

        tbody tr:hover {
            background: var(--hover);
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .paid {
            background: rgba(22, 163, 74, 0.12);
            color: var(--success);
        }

        .pending {
            background: rgba(217, 119, 6, 0.12);
            color: var(--warning);
        }


        /* =========================
           ACTION BUTTON
        ========================= */

        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: 600;
        }

        .pay-btn {
            background: #22c55e;
        }

        .pay-btn:hover {
            background: #16a34a;
        }


        /* =========================
           NO DATA
        ========================= */

        .no-data {
            text-align: center;
            padding: 25px;
            color: var(--muted);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: 1fr;
            }

            form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

        }


        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                gap: 10px;
            }

            nav div {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <h2>
            HRGenius
        </h2>

        <div>

            <button
                class="dashboard-btn"
                onclick="goDashboard()">

                Dashboard

            </button>


            <button
                id="themeToggle"
                class="theme-toggle"
                onclick="toggleTheme()">

                🌙 Dark Mode

            </button>


            <button
                class="logout-btn"
                onclick="logout()">

                Logout

            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">


        <h1>
            Payroll Management
        </h1>


        <!-- =========================
             SUMMARY CARDS
        ========================= -->

        <div class="cards">


            <div class="card">

                <h3>
                    Total Payroll
                </h3>

                <p id="totalPayroll">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Paid Payroll
                </h3>

                <p id="paidPayroll">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Pending Payroll
                </h3>

                <p id="pendingPayroll">
                    0
                </p>

            </div>


        </div>


        <!-- =========================
             GENERATE PAYROLL
        ========================= -->

        <div class="form-container">


            <h2>
                Generate Payroll
            </h2>


            <form id="payrollForm">


                <!-- EMPLOYEE ID -->

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Enter Employee ID"
                        required
                    >

                </div>


                <!-- PAYROLL MONTH -->

                <div class="form-group">

                    <label for="month">
                        Payroll Month
                    </label>

                    <input
                        type="month"
                        id="month"
                        required
                    >

                </div>


                <!-- BASIC SALARY -->

                <div class="form-group">

                    <label for="basicSalary">
                        Basic Salary
                    </label>

                    <input
                        type="number"
                        id="basicSalary"
                        placeholder="Basic Salary"
                        min="0"
                        required
                    >

                </div>


                <!-- ALLOWANCES -->

                <div class="form-group">

                    <label for="allowances">
                        Allowances
                    </label>

                    <input
                        type="number"
                        id="allowances"
                        placeholder="Allowances"
                        value="0"
                        min="0"
                        required
                    >

                </div>


                <!-- DEDUCTIONS -->

                <div class="form-group">

                    <label for="deductions">
                        Deductions
                    </label>

                    <input
                        type="number"
                        id="deductions"
                        placeholder="Deductions"
                        value="0"
                        min="0"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    id="generatePayrollBtn"
                    class="submit-btn full">

                    Generate Payroll

                </button>


            </form>


            <div
                id="message"
                class="message">

            </div>


        </div>


        <!-- =========================
             PAYROLL RECORDS
        ========================= -->

        <div class="table-container">


            <h2>
                Payroll Records
            </h2>


            <table>


                <thead>

                    <tr>

                        <th>
                            Employee
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Month
                        </th>

                        <th>
                            Basic Salary
                        </th>

                        <th>
                            Allowances
                        </th>

                        <th>
                            Deductions
                        </th>

                        <th>
                            Net Salary
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="payrollTableBody">

                    <tr>

                        <td
                            colspan="10"
                            class="no-data">

                            Loading payroll records...

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="JS/auth.js"></script>

    <script src="JS/theme.js"></script>

    <script src="JS/payroll.js"></script>


</body>

</html>
