<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Performance Management - HRGenius</title>

    <link rel="stylesheet" href="CSS/style.css">

    <style>

        /* =========================
           NAVBAR
        ========================= */

        nav {
            background: var(--sidebar);

            color: var(--text);

            padding: 15px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            border-bottom: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        nav h2 {
            color: var(--primary);
        }

        nav div {
            display: flex;

            gap: 15px;

            align-items: center;

            flex-wrap: wrap;
        }

        nav a {
            color: var(--text);

            text-decoration: none;

            font-weight: 600;
        }

        nav a:hover {
            color: var(--primary);

            text-decoration: underline;
        }

        .logout-link {
            cursor: pointer;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 90%;

            max-width: 1200px;

            margin: 30px auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--text);
        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .card {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        .card h3 {
            color: var(--muted);

            margin-bottom: 10px;

            font-size: 16px;
        }

        .card p {
            font-size: 28px;

            font-weight: bold;

            color: var(--primary);
        }


        /* =========================
           FORM BOX
        ========================= */

        .form-box {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            margin-bottom: 30px;
        }

        .form-box h2 {
            margin-bottom: 20px;

            color: var(--text);
        }

        .form-grid {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .form-group.full {
            grid-column: span 2;
        }

        label {
            margin-bottom: 6px;

            font-weight: bold;

            color: var(--text);
        }

        input,
        textarea,
        select {
            padding: 11px;

            border: 1px solid var(--border);

            border-radius: 6px;

            font-size: 14px;

            background: var(--input);

            color: var(--text);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--muted);
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;

            border-color: var(--primary);
        }

        textarea {
            resize: vertical;

            min-height: 90px;
        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {
            margin-top: 20px;

            padding: 11px 18px;

            border: none;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;

            background: var(--primary);

            color: white;
        }

        .submit-btn:hover {
            background: var(--primary-hover);
        }


        /* =========================
           MESSAGE
        ========================= */

        .message {
            margin-top: 15px;

            padding: 10px;

            border-radius: 6px;

            display: none;
        }

        .success {
            background: rgba(22, 163, 74, 0.12);

            color: var(--success);
        }

        .error {
            background: rgba(220, 38, 38, 0.12);

            color: var(--danger);
        }


        /* =========================
           TABLE
        ========================= */

        .table-box {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            overflow-x: auto;
        }

        .table-box h2 {
            margin-bottom: 20px;

            color: var(--text);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;

            background: var(--card);
        }

        th,
        td {
            padding: 12px;

            border-bottom: 1px solid var(--border);

            text-align: left;

            vertical-align: top;

            color: var(--text);
        }

        th {
            background: var(--hover);

            color: var(--text);
        }

        tbody tr:hover {
            background: var(--hover);
        }

        td small {
            color: var(--muted);
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            display: inline-block;
        }

        .pending {
            background: rgba(217, 119, 6, 0.12);

            color: var(--warning);
        }

        .reviewed {
            background: rgba(22, 163, 74, 0.12);

            color: var(--success);
        }


        /* =========================
           RATING
        ========================= */

        .rating {
            font-weight: bold;

            color: var(--primary);
        }


        /* =========================
           REVIEW BUTTON
        ========================= */

        .review-btn {
            padding: 7px 12px;

            background: #16a34a;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-weight: bold;
        }

        .review-btn:hover {
            background: #15803d;
        }


        /* =========================
           NO DATA
        ========================= */

        .no-data {
            text-align: center;

            padding: 25px;

            color: var(--muted);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: span 1;
            }

        }


        @media (max-width: 600px) {

            .cards {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;

                gap: 10px;
            }

            nav div {
                gap: 10px;

                justify-content: center;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <nav>

        <h2>
            HRGenius
        </h2>


        <div>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="employees.html">
                Employees
            </a>

            <a href="performance.html">
                Performance
            </a>


            <button
                id="themeToggle"
                class="theme-toggle"
                onclick="toggleTheme()">

                🌙 Dark Mode

            </button>


            <a
                class="logout-link"
                onclick="logout()">

                Logout

            </a>

        </div>

    </nav>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">


        <!-- HEADER -->

        <div class="header">

            <h1>
                Performance Management
            </h1>

        </div>


        <!-- =========================
             SUMMARY CARDS
        ========================= -->

        <div class="cards">


            <div class="card">

                <h3>
                    Total Reviews
                </h3>

                <p id="totalReviews">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Reviewed
                </h3>

                <p id="reviewedReviews">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Pending
                </h3>

                <p id="pendingReviews">
                    0
                </p>

            </div>


            <div class="card">

                <h3>
                    Average Rating
                </h3>

                <p id="averageRating">
                    0
                </p>

            </div>


        </div>


        <!-- =========================
             ADD PERFORMANCE REVIEW
        ========================= -->

        <div class="form-box">

            <h2>
                Add Performance Review
            </h2>


            <form id="performanceForm">


                <div class="form-grid">


                    <!-- EMPLOYEE ID -->

                    <div class="form-group">

                        <label>
                            Employee ID
                        </label>

                        <input
                            type="text"
                            id="employeeId"
                            placeholder="Enter Employee ID"
                            required
                        >

                    </div>


                    <!-- REVIEW PERIOD -->

                    <div class="form-group">

                        <label>
                            Review Period
                        </label>

                        <input
                            type="text"
                            id="reviewPeriod"
                            placeholder="Example: October 2026"
                            required
                        >

                    </div>


                    <!-- GOALS -->

                    <div class="form-group full">

                        <label>
                            Goals
                        </label>

                        <textarea
                            id="goals"
                            placeholder="Enter employee goals"
                            required
                        ></textarea>

                    </div>


                    <!-- ACHIEVEMENTS -->

                    <div class="form-group full">

                        <label>
                            Achievements
                        </label>

                        <textarea
                            id="achievements"
                            placeholder="Enter employee achievements"
                            required
                        ></textarea>

                    </div>


                    <!-- RATING -->

                    <div class="form-group">

                        <label>
                            Rating
                        </label>

                        <select
                            id="rating"
                            required>

                            <option value="">
                                Select Rating
                            </option>

                            <option value="1">
                                1 - Poor
                            </option>

                            <option value="2">
                                2 - Below Average
                            </option>

                            <option value="3">
                                3 - Average
                            </option>

                            <option value="4">
                                4 - Good
                            </option>

                            <option value="5">
                                5 - Excellent
                            </option>

                        </select>

                    </div>


                    <!-- FEEDBACK -->

                    <div class="form-group">

                        <label>
                            Feedback
                        </label>

                        <input
                            type="text"
                            id="feedback"
                            placeholder="Enter feedback"
                            required
                        >

                    </div>


                    <!-- STATUS -->

                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="status">

                            <option value="Pending">
                                Pending
                            </option>

                            <option value="Reviewed">
                                Reviewed
                            </option>

                        </select>

                    </div>


                </div>


                <button
                    type="submit"
                    class="submit-btn">

                    Add Performance Review

                </button>


                <div
                    id="message"
                    class="message">

                </div>


            </form>

        </div>


        <!-- =========================
             PERFORMANCE TABLE
        ========================= -->

        <div class="table-box">

            <h2>
                Performance Reviews
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Employee
                        </th>

                        <th>
                            Review Period
                        </th>

                        <th>
                            Goals
                        </th>

                        <th>
                            Achievements
                        </th>

                        <th>
                            Rating
                        </th>

                        <th>
                            Feedback
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="performanceTable">

                    <tr>

                        <td
                            colspan="8"
                            class="no-data">

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        const API_URL =
            "http://localhost:5000/api/performance";


        const token =
            localStorage.getItem("token");


        // =========================
        // LOGIN CHECK
        // =========================

        if (!token) {

            window.location.href =
                "login.html";

        }


        // =========================
        // SHOW MESSAGE
        // =========================

        function showMessage(
            message,
            type
        ) {

            const messageBox =
                document.getElementById(
                    "message"
                );


            messageBox.className =
                "message " + type;


            messageBox.style.display =
                "block";


            messageBox.textContent =
                message;


            setTimeout(
                function() {

                    messageBox.style.display =
                        "none";

                },
                3000
            );

        }


        // =========================
        // LOAD PERFORMANCE REVIEWS
        // =========================

        async function loadPerformances() {

            try {

                const response =
                    await fetch(
                        API_URL,
                        {
                            method: "GET",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Failed to load performance records"
                    );

                }


                const performances =
                    data.performances || [];


                displayPerformances(
                    performances
                );


                updateCards(
                    performances
                );


            }

            catch (error) {

                console.error(error);


                document.getElementById(
                    "performanceTable"
                ).innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="no-data">

                            Error loading performance records

                        </td>

                    </tr>

                `;

            }

        }


        // =========================
        // DISPLAY PERFORMANCE REVIEWS
        // =========================

        function displayPerformances(
            performances
        ) {

            const table =
                document.getElementById(
                    "performanceTable"
                );


            table.innerHTML = "";


            if (
                performances.length === 0
            ) {

                table.innerHTML = `

                    <tr>

                        <td
                            colspan="8"
                            class="no-data">

                            No performance records found

                        </td>

                    </tr>

                `;

                return;

            }


            performances.forEach(
                function(performance) {


                    const employee =
                        performance.employeeId;


                    const employeeName =
                        employee &&
                        typeof employee ===
                        "object"
                            ? employee.name
                            : "Unknown";


                    const employeeEmail =
                        employee &&
                        typeof employee ===
                        "object"
                            ? employee.email
                            : "-";


                    const status =
                        performance.status ||
                        "Pending";


                    const statusClass =
                        status === "Reviewed"
                            ? "reviewed"
                            : "pending";


                    let action = "-";


                    if (
                        status ===
                        "Pending"
                    ) {

                        action = `

                            <button
                                class="review-btn"
                                onclick="updateStatus(
                                    '${performance._id}',
                                    'Reviewed'
                                )">

                                Review

                            </button>

                        `;

                    }


                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>

                            <strong>
                                ${employeeName}
                            </strong>

                            <br>

                            <small>
                                ${employeeEmail}
                            </small>

                        </td>


                        <td>
                            ${performance.reviewPeriod}
                        </td>


                        <td>
                            ${performance.goals}
                        </td>


                        <td>
                            ${performance.achievements}
                        </td>


                        <td class="rating">

                            ${performance.rating}
                            / 5

                        </td>


                        <td>
                            ${performance.feedback}
                        </td>


                        <td>

                            <span
                                class="status ${statusClass}">

                                ${status}

                            </span>

                        </td>


                        <td>

                            ${action}

                        </td>

                    `;


                    table.appendChild(row);

                }
            );

        }


        // =========================
        // UPDATE SUMMARY CARDS
        // =========================

        function updateCards(
            performances
        ) {


            const total =
                performances.length;


            const reviewed =
                performances.filter(
                    function(performance) {

                        return (
                            performance.status ===
                            "Reviewed"
                        );

                    }
                ).length;


            const pending =
                performances.filter(
                    function(performance) {

                        return (
                            performance.status ===
                            "Pending"
                        );

                    }
                ).length;


            let average = 0;


            if (total > 0) {

                const totalRating =
                    performances.reduce(
                        function(
                            sum,
                            performance
                        ) {

                            return (
                                sum +
                                Number(
                                    performance.rating
                                )
                            );

                        },
                        0
                    );


                average =
                    (
                        totalRating /
                        total
                    ).toFixed(1);

            }


            document.getElementById(
                "totalReviews"
            ).textContent =
                total;


            document.getElementById(
                "reviewedReviews"
            ).textContent =
                reviewed;


            document.getElementById(
                "pendingReviews"
            ).textContent =
                pending;


            document.getElementById(
                "averageRating"
            ).textContent =
                average;

        }


        // =========================
        // ADD PERFORMANCE REVIEW
        // =========================

        document
            .getElementById(
                "performanceForm"
            )
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();


                    const performanceData = {

                        employeeId:
                            document
                                .getElementById(
                                    "employeeId"
                                )
                                .value
                                .trim(),

                        reviewPeriod:
                            document
                                .getElementById(
                                    "reviewPeriod"
                                )
                                .value
                                .trim(),

                        goals:
                            document
                                .getElementById(
                                    "goals"
                                )
                                .value
                                .trim(),

                        achievements:
                            document
                                .getElementById(
                                    "achievements"
                                )
                                .value
                                .trim(),

                        rating:
                            Number(
                                document
                                    .getElementById(
                                        "rating"
                                    )
                                    .value
                            ),

                        feedback:
                            document
                                .getElementById(
                                    "feedback"
                                )
                                .value
                                .trim()

                    };


                    try {


                        const response =
                            await fetch(
                                `${API_URL}/create`,
                                {

                                    method:
                                        "POST",

                                    headers: {

                                        "Content-Type":
                                            "application/json",

                                        "Authorization":
                                            `Bearer ${token}`

                                    },

                                    body:
                                        JSON.stringify(
                                            performanceData
                                        )

                                }
                            );


                        const data =
                            await response.json();


                        if (!response.ok) {

                            throw new Error(
                                data.message ||
                                data.error ||
                                "Failed to create performance review"
                            );

                        }


                        showMessage(
                            "Performance review created successfully",
                            "success"
                        );


                        document
                            .getElementById(
                                "performanceForm"
                            )
                            .reset();


                        loadPerformances();


                    }

                    catch (error) {

                        console.error(error);


                        showMessage(
                            error.message,
                            "error"
                        );

                    }

                }
            );


        // =========================
        // UPDATE PERFORMANCE STATUS
        // =========================

        async function updateStatus(
            id,
            status
        ) {


            try {


                const response =
                    await fetch(
                        `${API_URL}/${id}/status`,
                        {

                            method:
                                "PUT",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`

                            },

                            body:
                                JSON.stringify({

                                    status:
                                        status

                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error ||
                        "Failed to update status"
                    );

                }


                showMessage(
                    "Performance status updated successfully",
                    "success"
                );


                loadPerformances();


            }

            catch (error) {

                console.error(error);


                showMessage(
                    error.message,
                    "error"
                );

            }

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "token"
            );


            window.location.href =
                "login.html";

        }


        // =========================
        // INITIAL LOAD
        // =========================

        loadPerformances();


    </script>


    <script src="JS/auth.js"></script>

    <script src="JS/theme.js"></script>


</body>

</html>
