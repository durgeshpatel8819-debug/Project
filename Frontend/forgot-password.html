<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>HRGenius - Forgot Password</title>

<link
    rel="stylesheet"
    href="CSS/style.css"

<style>

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
    }

    .reset-container {
        width: 100%;
        max-width: 460px;
        padding: 20px;
    }

    .reset-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px;
        box-shadow: var(--shadow);
    }

    .logo {
        text-align: center;
        margin-bottom: 30px;
    }

    .logo h1 {
        margin: 0;
        color: var(--primary);
        font-size: 32px;
    }

    .logo p {
        margin-top: 8px;
        color: var(--muted);
    }

    .step {
        display: none;
    }

    .step.active {
        display: block;
    }

    .step h2 {
        color: var(--text);
        margin-bottom: 10px;
    }

    .step-description {
        color: var(--muted);
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: var(--text);
        font-weight: 600;
    }

    .form-group input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--input);
        color: var(--text);
        font-size: 15px;
        box-sizing: border-box;
    }

    .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn:hover {
        background: var(--primary-hover);
    }

    .back-login {
        text-align: center;
        margin-top: 22px;
    }

    .back-login a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
    }

    .back-login a:hover {
        text-decoration: underline;
    }

    .message {
        margin-top: 18px;
        padding: 12px;
        border-radius: 8px;
        display: none;
        font-size: 14px;
        line-height: 1.5;
    }

    .message.show {
        display: block;
    }

    .message.success {
        background: rgba(34, 197, 94, 0.12);
        color: #16a34a;
    }

    .message.error {
        background: rgba(239, 68, 68, 0.12);
        color: #dc2626;
    }

    .otp-input {
        text-align: center;
        font-size: 24px !important;
        letter-spacing: 8px;
        font-weight: bold;
    }

    .password-rules {
        color: var(--muted);
        font-size: 13px;
        margin-top: 8px;
    }

    @media (max-width: 500px) {

        .reset-container {
            padding: 15px;
        }

        .reset-card {
            padding: 25px;
        }

        .logo h1 {
            font-size: 28px;
        }

    }

</style>

</head>

<body>

```
<div class="reset-container">

    <div class="reset-card">

        <div class="logo">

            <h1>HRGenius</h1>

            <p>Password Recovery</p>

        </div>

        <!-- STEP 1 -->

        <div
            class="step active"
            id="step1"
        >

            <h2>
                Forgot Password?
            </h2>

            <p class="step-description">
                Enter your registered email address and
                we'll send you a 6-digit OTP.
            </p>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                >

            </div>

            <button
                class="btn"
                onclick="sendOTP()"
            >
                Send OTP
            </button>

        </div>

        <!-- STEP 2 -->

        <div
            class="step"
            id="step2"
        >

            <h2>
                Verify OTP
            </h2>

            <p class="step-description">
                Enter the 6-digit OTP sent to your email.
            </p>

            <div class="form-group">

                <label for="otp">
                    OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    class="otp-input"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="000000"
                >

            </div>

            <button
                class="btn"
                onclick="verifyOTP()"
            >
                Verify OTP
            </button>

        </div>

        <!-- STEP 3 -->

        <div
            class="step"
            id="step3"
        >

            <h2>
                Create New Password
            </h2>

            <p class="step-description">
                Enter your new password below.
            </p>

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                >

                <div class="password-rules">
                    Minimum 6 characters
                </div>

            </div>

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                >

            </div>

            <button
                class="btn"
                onclick="resetPassword()"
            >
                Reset Password
            </button>

        </div>

        <div
            id="message"
            class="message"
        ></div>

        <div class="back-login">

            <a href="login.html">
                ← Back to Login
            </a>

        </div>

    </div>

</div>

<script>

    let userEmail = "";
    let userOTP = "";

    function showMessage(message, type) {

        const messageBox =
            document.getElementById("message");

        messageBox.textContent = message;

        messageBox.className =
            "message show " + type;
    }

    function showStep(stepNumber) {

        document
            .querySelectorAll(".step")
            .forEach(function (step) {

                step.classList.remove("active");

            });

        document
            .getElementById("step" + stepNumber)
            .classList.add("active");

        document.getElementById("message")
            .className = "message";
    }

    async function sendOTP() {

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        if (!email) {

            showMessage(
                "Please enter your email address.",
                "error"
            );

            return;
        }

        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Failed to send OTP.",
                    "error"
                );

                return;
            }

            userEmail = email;

            showMessage(
                "OTP sent successfully. Check your email.",
                "success"
            );

            setTimeout(
                function () {

                    showStep(2);

                },
                1000
            );

        } catch (error) {

            console.error(error);

            showMessage(
                "Server connection failed.",
                "error"
            );
        }
    }

    async function verifyOTP() {

        const otp =
            document
                .getElementById("otp")
                .value
                .trim();

        if (!otp || otp.length !== 6) {

            showMessage(
                "Please enter a valid 6-digit OTP.",
                "error"
            );

            return;
        }

        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/verify-reset-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: userEmail,
                            otp: otp
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Invalid OTP.",
                    "error"
                );

                return;
            }

            userOTP = otp;

            showMessage(
                "OTP verified successfully.",
                "success"
            );

            setTimeout(
                function () {

                    showStep(3);

                },
                700
            );

        } catch (error) {

            console.error(error);

            showMessage(
                "Server connection failed.",
                "error"
            );
        }
    }

    async function resetPassword() {

        const newPassword =
            document
                .getElementById("newPassword")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;

        if (!newPassword || !confirmPassword) {

            showMessage(
                "Please fill both password fields.",
                "error"
            );

            return;
        }

        if (newPassword.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }

        if (newPassword !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }

        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: userEmail,
                            otp: userOTP,
                            newPassword: newPassword
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Password reset failed.",
                    "error"
                );

                return;
            }

            showMessage(
                "Password reset successfully! Redirecting to login...",
                "success"
            );

            setTimeout(
                function () {

                    window.location.href =
                        "login.html";

                },
                2000
            );

        } catch (error) {

            console.error(error);

            showMessage(
                "Server connection failed.",
                "error"
            );
        }
    }

</script>


</body>

</html>
