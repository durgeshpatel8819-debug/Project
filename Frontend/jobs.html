<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HRGenius - Jobs</title>

    <link
        rel="stylesheet"
        href="CSS/style.css"
    >

    <style>

        .navbar {
            height: 65px;
            background: var(--primary);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .navbar h2 {
            color: #ffffff;
            font-size: 24px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav-btn {
            background: #ffffff;
            color: var(--primary);
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .nav-btn:hover {
            background: #e5e7eb;
        }

        .container {
            padding: 30px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            color: var(--text);
            margin-bottom: 8px;
        }

        .heading p {
            color: var(--muted);
        }

        .form-box,
        .table-box {
            background: var(--card);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .form-box h2,
        .table-box h2 {
            color: var(--text);
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: var(--text);
            font-weight: bold;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 11px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--input);
            color: var(--text);
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .submit-btn {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn {
            background: #6b7280;
            color: #ffffff;
            border: none;
            padding: 11px 22px;
            border-radius: 6px;
            cursor: pointer;
            display: none;
        }

        #message {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            max-width: 450px;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--input);
            color: var(--text);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            text-align: left;
        }

        th {
            background: var(--hover);
            color: var(--text);
        }

        td {
            color: var(--text);
        }

        .edit-btn {
            background: #f59e0b;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .status-open {
            color: #16a34a;
            font-weight: bold;
        }

        .status-closed {
            color: #dc2626;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: var(--muted);
        }

        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .navbar {
                padding: 0 15px;
            }

        }

    </style>

</head>


<body>


    <div class="navbar">

        <h2>HRGenius</h2>

        <div class="nav-buttons">

            <button
                class="nav-btn"
                onclick="window.location.href='dashboard.html'"
            >
                Dashboard
            </button>

            <button
                id="themeToggle"
                class="nav-btn"
                onclick="toggleTheme()"
            >
                🌙 Dark Mode
            </button>

            <button
                class="nav-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <div class="container">

        <div class="heading">

            <h1>Job Management</h1>

            <p>
                Manage job openings and recruitment positions
            </p>

        </div>


        <div id="message"></div>


        <div
            class="form-box"
            id="jobFormBox"
        >

            <h2 id="formTitle">
                Add Job
            </h2>


            <form id="jobForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label>
                            Job Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="Software Developer"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Department
                        </label>

                        <input
                            type="text"
                            id="department"
                            placeholder="IT"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Location
                        </label>

                        <input
                            type="text"
                            id="location"
                            placeholder="Ghaziabad"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Job Type
                        </label>

                        <select
                            id="jobType"
                            required
                        >

                            <option value="Full Time">
                                Full Time
                            </option>

                            <option value="Part Time">
                                Part Time
                            </option>

                            <option value="Internship">
                                Internship
                            </option>

                            <option value="Contract">
                                Contract
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Salary
                        </label>

                        <input
                            type="number"
                            id="salary"
                            placeholder="55000"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>
                            Status
                        </label>

                        <select id="status">

                            <option value="Open">
                                Open
                            </option>

                            <option value="Closed">
                                Closed
                            </option>

                        </select>

                    </div>


                    <div class="form-group full-width">

                        <label>
                            Job Description
                        </label>

                        <textarea
                            id="description"
                            placeholder="Enter job description"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group full-width">

                        <label>
                            Requirements
                        </label>

                        <textarea
                            id="requirements"
                            placeholder="Enter required skills and qualifications"
                            required
                        ></textarea>

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="submit-btn"
                        id="submitBtn"
                    >
                        Add Job
                    </button>

                    <button
                        type="button"
                        class="cancel-btn"
                        id="cancelBtn"
                        onclick="cancelEdit()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <div class="table-box">

            <h2>
                Job Records
            </h2>


            <div class="search-box">

                <input
                    type="text"
                    id="searchJob"
                    class="search-input"
                    placeholder="🔍 Search jobs..."
                >

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Job Title</th>
                            <th>Department</th>
                            <th>Location</th>
                            <th>Type</th>
                            <th>Salary</th>
                            <th>Status</th>
                            <th>Description</th>
                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="jobTableBody">

                        <tr>

                            <td
                                colspan="8"
                                class="no-data"
                            >
                                Loading jobs...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="./JS/theme.js"></script>

    <script src="./JS/auth.js"></script>

    <script src="./JS/jobs.js"></script>


</body>

</html>
