<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HRGenius - Attendance</title>

    <link rel="stylesheet"
          href="CSS/style.css">

    <style>

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 65px;

            background: var(--primary);
            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;
        }

        .navbar h2 {
            font-size: 24px;
            color: #ffffff;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: #ffffff;
            color: var(--primary);

            border: none;

            padding: 9px 16px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: bold;
        }

        .nav-btn:hover {
            background: #e5e7eb;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            padding: 30px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            margin-bottom: 8px;
            color: var(--text);
        }

        .heading p {
            color: var(--muted);
        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .card {
            background: var(--card);

            color: var(--text);

            padding: 22px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);
        }

        .card h3 {
            color: var(--muted);

            margin-bottom: 12px;
        }

        .card .number {
            font-size: 30px;

            font-weight: bold;

            color: var(--primary);
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;

            padding: 12px;

            border-radius: 6px;

            margin-bottom: 20px;
        }


        /* =========================
           FORM
        ========================= */

        .form-box {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            margin-bottom: 30px;
        }

        .form-box h2 {
            margin-bottom: 20px;

            color: var(--text);
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }

        .form-group {
            display: flex;

            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 6px;

            font-weight: bold;

            color: var(--text);
        }

        .form-group input,
        .form-group select {
            padding: 11px;

            border: 1px solid var(--border);

            border-radius: 6px;

            font-size: 14px;

            background: var(--input);

            color: var(--text);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;

            border-color: var(--primary);
        }


        /* =========================
           FORM BUTTONS
        ========================= */

        .form-actions {
            margin-top: 20px;

            display: flex;

            gap: 10px;
        }

        .action-btn {
            border: none;

            padding: 11px 22px;

            border-radius: 6px;

            cursor: pointer;

            color: white;

            font-weight: bold;
        }

        .check-in-btn {
            background: #16a34a;
        }

        .check-in-btn:hover {
            background: #15803d;
        }

        .check-out-btn {
            background: #dc2626;
        }

        .check-out-btn:hover {
            background: #b91c1c;
        }


        /* =========================
           TABLE
        ========================= */

        .table-box {
            background: var(--card);

            color: var(--text);

            padding: 25px;

            border-radius: 10px;

            border: 1px solid var(--border);

            box-shadow: var(--shadow);

            overflow-x: auto;
        }

        .table-box h2 {
            margin-bottom: 20px;

            color: var(--text);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 800px;

            background: var(--card);
        }

        th,
        td {
            padding: 12px;

            border-bottom:
                1px solid var(--border);

            text-align: left;
        }

        th {
            background: var(--hover);

            color: var(--text);
        }

        td {
            color: var(--text);
        }

        tr:hover {
            background: var(--hover);
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            padding: 5px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;
        }

        .present {
            background:
                rgba(22, 163, 74, 0.12);

            color: var(--success);
        }

        .absent {
            background:
                rgba(220, 38, 38, 0.12);

            color: var(--danger);
        }


        /* =========================
           NO DATA
        ========================= */

        .no-data {
            text-align: center;

            padding: 20px;

            color: var(--muted);
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .navbar {
                padding: 0 15px;
            }

            .nav-buttons {
                gap: 5px;
            }

            .nav-btn {
                padding: 8px 10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">

        <h2>HRGenius</h2>


        <div class="nav-buttons">


            <button
                class="nav-btn"
                onclick="window.location.href='dashboard.html'">

                Dashboard

            </button>


            <button
                id="themeToggle"
                class="theme-toggle"
                onclick="toggleTheme()">

                🌙 Dark Mode

            </button>


            <button
                class="nav-btn"
                onclick="logout()">

                Logout

            </button>


        </div>

    </div>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="container">


        <!-- =========================
             HEADING
        ========================= -->

        <div class="heading">

            <h1>
                Attendance Management
            </h1>

            <p>
                Manage employee attendance
                and check-in/check-out
            </p>

        </div>


        <!-- =========================
             MESSAGE
        ========================= -->

        <div id="message"></div>


        <!-- =========================
             SUMMARY CARDS
        ========================= -->

        <div class="cards">


            <div class="card">

                <h3>
                    Total Attendance
                </h3>

                <div
                    class="number"
                    id="totalAttendance">

                    0

                </div>

            </div>


            <div class="card">

                <h3>
                    Present Today
                </h3>

                <div
                    class="number"
                    id="presentToday">

                    0

                </div>

            </div>


            <div class="card">

                <h3>
                    Attendance Records
                </h3>

                <div
                    class="number"
                    id="attendanceRecords">

                    0

                </div>

            </div>


        </div>


        <!-- =========================
             MARK ATTENDANCE
        ========================= -->

        <div class="form-box">

            <h2>
                Mark Attendance
            </h2>


            <div class="form-grid">


                <!-- EMPLOYEE ID -->

                <div class="form-group">

                    <label for="employeeId">
                        Employee ID
                    </label>

                    <input
                        type="text"
                        id="employeeId"
                        placeholder="Enter Employee ID">

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label for="attendanceDate">
                        Date
                    </label>

                    <input
                        type="date"
                        id="attendanceDate">

                </div>


                <!-- STATUS -->

                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select id="status">

                        <option value="Present">
                            Present
                        </option>

                        <option value="Absent">
                            Absent
                        </option>

                    </select>

                </div>


            </div>


            <!-- =========================
                 BUTTONS
            ========================= -->

            <div class="form-actions">


                <button
                    type="button"
                    class="action-btn check-in-btn"
                    onclick="checkIn()">

                    Check In

                </button>


                <button
                    type="button"
                    class="action-btn check-out-btn"
                    onclick="checkOut()">

                    Check Out

                </button>


            </div>


        </div>


        <!-- =========================
             ATTENDANCE TABLE
        ========================= -->

        <div class="table-box">

            <h2>
                Attendance Records
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Employee
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Department
                        </th>

                        <th>
                            Date
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Check In
                        </th>

                        <th>
                            Check Out
                        </th>

                    </tr>

                </thead>


                <tbody id="attendanceTableBody">

                    <tr>

                        <td
                            colspan="7"
                            class="no-data">

                            Loading attendance
                            records...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


    <!-- =========================
         JAVASCRIPT FILES
    ========================= -->

    <script src="JS/auth.js"></script>

    <script src="JS/theme.js"></script>

    <script src="JS/attendance.js"></script>


</body>

</html>
